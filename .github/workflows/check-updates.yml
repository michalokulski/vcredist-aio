name: Check for Winget Updates

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: check-updates
  cancel-in-progress: false

jobs:
  check-updates:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check for updates
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & ./automation/update-check.ps1 -PackagesFile packages.json

      - name: Create or update Pull Request
        if: hashFiles('updates-found.txt') != ''
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/auto
          base: main
          commit-message: "chore: update packages.json to latest Winget versions"
          title: "chore: update VC++ Redist packages"
          body: |
            Automated Winget version check — new versions detected.

            Merge this PR to trigger the build and release workflow.
          labels: automated,update
          delete-branch: false