name: PowerShell Lint

on:
  push:
    paths:
      - '**.ps1'
      - '**.psm1'
  pull_request:
    paths:
      - '**.ps1'
      - '**.psm1'
  workflow_dispatch:

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings PSScriptAnalyzerSettings.psd1
          if ($results) {
            $results | Format-Table -AutoSize
            Write-Host "::error::$($results.Count) PSScriptAnalyzer issue(s) found."
            exit 1
          }
          Write-Host "No PSScriptAnalyzer issues found."

      - name: Install PowerShell-Beautifier
        shell: pwsh
        run: Install-Module -Name PowerShell-Beautifier -Force -Scope CurrentUser

      - name: Run PowerShell-Beautifier
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Include *.ps1,*.psm1 -Recurse | Edit-DTWBeautifyScript
          $diff = git diff --exit-code
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::PowerShell-Beautifier found formatting issues. Run Edit-DTWBeautifyScript locally."
            git diff --stat
            exit 1
          }
          Write-Host "All PowerShell files are properly formatted."